/* ============================================================================================

/* ---------------------------------- UTILITIES ---------------------------------- */
const $  = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid = (p='id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const pad2 = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const isoOf = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const addDays = (iso, n) => { const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoOf(d); };
const dayDiff = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
const toMin = (hhmm) => { const [h,m]=hhmm.split(':').map(Number); return h*60+m; };
const toHHMM = (mins) => { mins=((mins%1440)+1440)%1440; return `${pad2(Math.floor(mins/60))}:${pad2(mins%60)}`; };
const fmtTime12 = (hhmm) => { const [h,m]=hhmm.split(':').map(Number); const ap=h>=12?'PM':'AM'; let hh=h%12; if(hh===0)hh=12; return `${hh}:${pad2(m)} ${ap}`; };
const fmtDateLong = (iso) => new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const fmtDateShort = (iso) => new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const weekdayLetter = (iso) => new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'});
const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (msg, kind='info') => {
  const host = $('#toastHost'); if(!host) return;
  const id = uid('toast');
  const colors = { info:'border-indigo-500/40 bg-indigo-500/10 text-indigo-200', success:'border-emerald-500/40 bg-emerald-500/10 text-emerald-200', error:'border-rose-500/40 bg-rose-500/10 text-rose-200', warn:'border-amber-500/40 bg-amber-500/10 text-amber-200' };

  const el = document.createElement('div');
  el.id = id;
  el.className = `glass border ${colors[kind]} rounded-xl px-4 py-3 shadow-2xl flex items-start gap-2.5 animate-slide-up max-w-sm`;
  el.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 mt-0.5 shrink-0"></i><div class="text-sm leading-snug">${esc(msg)}</div>`;
  host.appendChild(el);
  lucide.createIcons();
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateX(12px)'; setTimeout(()=>el.remove(),260); }, 4200);
};

/* ---------------------------------- CONSTANTS ---------------------------------- */
const STORAGE_KEY = 'aether_study_engine_v1';
const PIN_STORAGE_KEY = 'aether_workspace_pin_v1'; // stored separately — never part of synced app state
const HOUR_PX = 48;
const DAY_START_H = 6;
const DAY_END_H = 24;

const TYPE_META = {
  class:    { label:'Uni Class',   short:'Class',   color:'#818cf8', dot:'bg-indigo-400',  ring:'ring-indigo-400/40',  icon:'graduation-cap', fixed:true,  weight:100 },
  exam:     { label:'Major Exam',  short:'Exam',     color:'#fb7185', dot:'bg-rose-400',    ring:'ring-rose-400/40',    icon:'file-warning',   fixed:true,  weight:95 },
  meeting:  { label:'Fixed Meeting', short:'Meeting',color:'#fbbf24', dot:'bg-amber-400',   ring:'ring-amber-400/40',   icon:'users',          fixed:true,  weight:80 },
  review:   { label:'AI Review',   short:'Review',   color:'#a78bfa', dot:'bg-violet-400',  ring:'ring-violet-400/40',  icon:'brain-circuit',  fixed:false, weight:50 },
  gym:      { label:'Gym / Workout', short:'Gym',    color:'#34d399', dot:'bg-emerald-400', ring:'ring-emerald-400/40', icon:'dumbbell',       fixed:false, weight:35 },
  personal: { label:'Personal',    short:'Personal', color:'#38bdf8', dot:'bg-sky-400',     ring:'ring-sky-400/40',    icon:'user-round',     fixed:false, weight:20 },
};
const TYPE_ORDER = ['class','exam','meeting','review','gym','personal'];

const SEED_COURSES = [
  { id:'course_physics', name:'Physics I — Mechanics', color:'#818cf8' },
  { id:'course_ochem',   name:'Organic Chemistry', color:'#fb7185' },
  { id:'course_calc',    name:'Calculus II', color:'#38bdf8' },
];

function defaultState(){
  const t = todayISO();
  return {
    v: 1,
    profile: { name:'Student', institution:'', targetInstitution:'', createdAt: Date.now() },
    apiProvider: 'deepseek', // 'anthropic' | 'openai' | 'deepseek'
    apiKey: '', // never hardcode a real key here — this file will be public once hosted
    apiModel: 'deepseek-chat',
    courses: [],
    tasks: [],
    performanceLog: [],
    roadmaps: [],
    chat: [ { role:'assistant', content:"Hi — I'm your AI Study Coach. Tell me how a session went (\"I struggled with fluid dynamics today\" or \"aced the practice set\") and I'll adapt your schedule automatically. Add your API key in Settings to enable me.", ts: Date.now() } ],
    constraints: {
      maxStudyHoursPerDay: 5,
      noStudyAfter: '22:00',
      noStudyBefore: '07:00',
      preserveWorkout: true,
      workoutWindows: [ { day:1, start:'18:00', end:'19:00' }, { day:3, start:'18:00', end:'19:00' }, { day:5, start:'17:00', end:'18:00' } ],
    },
    view: 'dashboard', // dashboard | weekly | daily
    dashTab: 'tasks', // tasks | coach
    selectedDate: t,
    weekAnchor: t,
    onboarded: false,
  };
}

// Some sandboxed contexts (data: URLs, certain preview iframes, private-mode edge cases)
// throw on any localStorage access. Detect that once and fall back to an in-memory store
// so the app stays fully functional for the session even if persistence isn't available.
let storageAvailable = true;
try{ const k='__aether_probe__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); }catch(e){ storageAvailable = false; }
let memoryStore = null;

// The shared-workspace PIN gates writes to the cloud (see SHARED CLOUD SYNC below). It's kept
// entirely separate from `state` so it's never swept up into the synced payload or committed
// anywhere — it lives only in this one browser's localStorage.
function loadLocalPin(){ try{ return localStorage.getItem(PIN_STORAGE_KEY) || ''; }catch(e){ return ''; } }
function saveLocalPin(v){ localPin = v; try{ localStorage.setItem(PIN_STORAGE_KEY, v); }catch(e){} }
let localPin = loadLocalPin();

let state = loadState();

function loadState(){
  try{
    if(!storageAvailable) return seedFirstRun(defaultState());
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return seedFirstRun(defaultState());
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ console.error('Failed to load state', e); return seedFirstRun(defaultState()); }
}
function save(){
  if(!storageAvailable){ memoryStore = state; return; }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Failed to persist state', e); storageAvailable = false; memoryStore = state; }
  if(!isApplyingRemote) queueCloudPush();
}

/* ---------------------------------- SHARED CLOUD SYNC (no login) ----------------------------------
   Everyone who opens this page's URL reads and writes the same single row in Supabase — that's the
   "shared link, no account" model. Pure UI/navigation state (which screen you're on) stays local.
   The AI provider settings are a separate case: they sync too, but only through a PIN-only-readable
   channel (workspace_secrets), never through the openly-readable shared_state row — so entering your
   AI key once propagates to every device that has the PIN, without it ever sitting in public source
   or being visible to someone who only has the link. */

const SUPABASE_URL = 'https://fmqmxcziejsbutamwctt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ZEya936sCv4D_pVICmQ9Qg_cCdpoAcH';
const SYNCED_KEYS = ['profile','courses','tasks','performanceLog','roadmaps','chat','constraints'];
const PROTECTED_KEYS = ['apiProvider','apiKey','apiModel']; // synced only via the PIN-gated secrets RPCs

let sb = null;
let cloudStatus = 'connecting'; // 'connecting' | 'synced' | 'syncing' | 'offline' | 'error'
let isApplyingRemote = false;
let cloudPushTimer = null;
let lastPushedSignature = '';

function pickSynced(s){ const o={}; SYNCED_KEYS.forEach(k=>{ o[k]=s[k]; }); return o; }

async function loadSharedSecrets(){
  if(!sb || !localPin) return;
  try{
    const { data, error } = await sb.rpc('get_shared_secrets', { pin: localPin });
    if(error) throw error;
    if(data && Object.keys(data).length){
      isApplyingRemote = true;
      PROTECTED_KEYS.forEach(k=>{ if(data[k]!==undefined && data[k]!=='') state[k]=data[k]; });
      save();
      isApplyingRemote = false;
      render();
    }
  }catch(e){ console.error('Could not load shared AI settings', e); }
}

function pushSharedSecrets(){
  if(!sb || !localPin) return;
  const payload = {}; PROTECTED_KEYS.forEach(k=>{ payload[k]=state[k]; });
  sb.rpc('set_shared_secrets', { pin: localPin, new_payload: payload }).then(({error})=>{
    if(error) console.error('Could not share AI settings', error);
  });
}
function applySynced(remote){ SYNCED_KEYS.forEach(k=>{ if(remote && remote[k]!==undefined) state[k]=remote[k]; }); }

function setCloudStatus(next){ if(cloudStatus===next) return; cloudStatus=next; renderCloudBadgeInPlace(); }

function initCloud(){
  if(typeof supabase === 'undefined'){ console.error('Supabase client failed to load — falling back to local-only.'); setCloudStatus('error'); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  loadFromCloud();
  if(localPin) loadSharedSecrets(); // already unlocked on this device — pull in the shared AI key
  sb.channel('shared_state_changes')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'shared_state', filter:'id=eq.main' }, (payload)=>{
      const incoming = payload.new?.data;
      if(!incoming) return;
      const sig = JSON.stringify(incoming);
      if(sig === lastPushedSignature) return; // echo of our own write — ignore, avoids a sync loop
      isApplyingRemote = true;
      applySynced(incoming);
      save(); // must run while isApplyingRemote is still true, or this re-triggers a cloud push
      render();
      isApplyingRemote = false;
      setCloudStatus(localPin ? 'synced' : 'locked');
      toast('Synced changes from another device.', 'info');
    })
    .subscribe();
}

async function loadFromCloud(){
  try{
    const { data, error } = await sb.from('shared_state').select('data').eq('id','main').single();
    if(error) throw error;
    if(data && data.data && Object.keys(data.data).length){
      isApplyingRemote = true;
      applySynced(data.data);
      save(); // see note above — order matters
      render();
      isApplyingRemote = false;
      setCloudStatus(localPin ? 'synced' : 'locked');
    } else if(localPin){
      // Empty shared row and we hold the PIN (we're the one who ran the setup SQL) — seed it.
      queueCloudPush(true);
    } else {
      // Empty shared row and no PIN yet — nothing to show or seed until someone unlocks it.
      setCloudStatus('locked');
    }
  }catch(e){
    console.error('Cloud load failed, working offline for now.', e);
    setCloudStatus('offline');
  }
}

// Writes are PIN-gated server-side: `shared_state` has no direct UPDATE policy for anon, so a
// plain `.update()` silently affects zero rows. The only write path is the `set_shared_state`
// RPC, which checks the PIN against a hash nobody (including this code) can read back out.
function queueCloudPush(immediate){
  if(!sb) return;
  if(!localPin){ setCloudStatus('locked'); return; } // nothing to push without a PIN — read-only
  clearTimeout(cloudPushTimer);
  const fire = async () => {
    setCloudStatus('syncing');
    const payload = pickSynced(state);
    lastPushedSignature = JSON.stringify(payload);
    const { error } = await sb.rpc('set_shared_state', { pin: localPin, new_data: payload });
    if(error){
      console.error('Cloud sync failed', error);
      if(/invalid pin/i.test(error.message||'')){ setCloudStatus('locked'); toast('That shared-workspace PIN was rejected — check it in Settings.', 'error'); }
      else setCloudStatus('error');
    } else setCloudStatus('synced');
  };
  if(immediate) fire(); else cloudPushTimer = setTimeout(fire, 700);
}

// Updates just the small status dot/label without a full re-render, so syncing state doesn't
// interrupt whatever the user is doing (typing in a modal, mid-scroll, etc).
function renderCloudBadgeInPlace(){
  const el = document.getElementById('cloudStatusBadge');
  if(!el) return;
  el.outerHTML = cloudBadgeMarkup();
  lucide.createIcons();
}
function cloudBadgeMarkup(){
  const meta = {
    connecting: { color:'text-slate-500', dot:'bg-slate-500', label:'Connecting…' },
    syncing:    { color:'text-amber-400', dot:'bg-amber-400 pulse-dot', label:'Syncing…' },
    synced:     { color:'text-emerald-400', dot:'bg-emerald-400', label:'Shared & synced' },
    locked:     { color:'text-amber-300', dot:'bg-amber-300', label:'Read-only — enter PIN to edit' },
    offline:    { color:'text-slate-500', dot:'bg-slate-600', label:'Offline (local only)' },
    error:      { color:'text-rose-400', dot:'bg-rose-400', label:'Sync error' },
  }[cloudStatus];
  const clickable = cloudStatus==='locked' || cloudStatus==='error';
  return `<span id="cloudStatusBadge" data-action="${clickable?'openPinModal':''}" title="${meta.label}" class="hidden sm:flex items-center gap-1.5 text-[10px] font-semibold ${meta.color} px-2 py-1 rounded-full bg-white/5 border border-white/10 ${clickable?'cursor-pointer hover:bg-white/10':''}">
    <span class="w-1.5 h-1.5 rounded-full ${meta.dot}"></span>${meta.label}
  </span>`;
}

function seedFirstRun(s){
  s.courses = SEED_COURSES.slice();
  const t = todayISO();
  const mk = (o) => ({ id:uid('task'), status:'pending', notes:'', topic:'', roadmapId:null, createdAt:Date.now(), completedAt:null, ...o });
  s.tasks = [
    mk({ title:'Physics I Lecture', type:'class', courseId:'course_physics', date:t, start:'09:00', end:'10:15' }),
    mk({ title:'Organic Chemistry Lab', type:'class', courseId:'course_ochem', date:t, start:'11:00', end:'13:00' }),
    mk({ title:'Study Group — Calc II', type:'meeting', courseId:'course_calc', date:t, start:'15:00', end:'16:00' }),
    mk({ title:'Gym — Push Day', type:'gym', courseId:null, date:t, start:'18:00', end:'19:00' }),
    mk({ title:'Review: Kinematics', type:'review', courseId:'course_physics', date:addDays(t,1), start:'19:00', end:'19:45', topic:'Kinematics' }),
    mk({ title:'Physics I Lecture', type:'class', courseId:'course_physics', date:addDays(t,1), start:'09:00', end:'10:15' }),
    mk({ title:'MCAT Full-Length Practice', type:'exam', courseId:null, date:addDays(t,5), start:'08:00', end:'12:00' }),
    mk({ title:'Gym — Legs', type:'gym', courseId:null, date:addDays(t,2), start:'18:00', end:'19:00' }),
    mk({ title:'Review: Reaction Mechanisms', type:'review', courseId:'course_ochem', date:addDays(t,2), start:'20:00', end:'20:30', topic:'Reaction Mechanisms' }),
  ];
  s.performanceLog = [
    { id:uid('perf'), topic:'Kinematics', courseId:'course_physics', rating:'ok', note:'Solid on 1D, shaky on projectile motion', date:t, taskId:null },
  ];

}

/* ---------------------------------- SCHEDULING ENGINE ---------------------------------- */

function typeWeight(t){ return TYPE_META[t.type]?.weight ?? 10; }

function tasksOnDate(date){ return state.tasks.filter(t=>t.date===date).sort((a,b)=>toMin(a.start)-toMin(b.start)); }

function overlaps(aStart,aEnd,bStart,bEnd){ return toMin(aStart) < toMin(bEnd) && toMin(bStart) < toMin(aEnd); }

// Find conflicting tasks for a candidate task (excluding itself)
function findConflicts(candidate){
  return tasksOnDate(candidate.date).filter(t => t.id !== candidate.id && overlaps(candidate.start,candidate.end,t.start,t.end));
}

// Find next open slot of `durationMin` minutes on/after `date`+`afterMin`, scanning forward up to `maxDaysAhead` days.
// Respects constraints.noStudyBefore/noStudyAfter and existing tasks (any overlap blocks the slot).
function findOpenSlot(startDate, durationMin, { afterMin=null, maxDaysAhead=10, dayStart=null, dayEnd=null, excludeId=null } = {}){
  const c = state.constraints;
  const lo = dayStart ?? toMin(c.noStudyBefore || '07:00');
  const hi = dayEnd ?? toMin(c.noStudyAfter || '22:00');
  for(let d=0; d<=maxDaysAhead; d++){
    const date = addDays(startDate, d);
    let cursor = (d===0 && afterMin!=null) ? Math.max(afterMin, lo) : lo;
    const dayTasks = tasksOnDate(date).filter(t=>t.id!==excludeId).sort((a,b)=>toMin(a.start)-toMin(b.start));
    // round cursor up to nearest 5 min
    cursor = Math.ceil(cursor/5)*5;
    while(cursor + durationMin <= hi){
      const candStart = toHHMM(cursor), candEnd = toHHMM(cursor+durationMin);
      const clash = dayTasks.find(t => overlaps(candStart,candEnd,t.start,t.end));
      if(!clash){ return { date, start:candStart, end:candEnd }; }
      cursor = Math.max(cursor+5, toMin(clash.end));
      cursor = Math.ceil(cursor/5)*5;
    }
  }
  return null; // couldn't find a slot
}

// Generate 3 smart alternative options for a conflicting candidate task.
function generateConflictOptions(candidate){
  const dur = toMin(candidate.end) - toMin(candidate.start);
  const half = Math.max(15, Math.round(dur/2/5)*5);
  const opts = [];

  // Option A: shift later same day (after 19:00 or after the conflicting block, whichever later)
  const conflicts = findConflicts(candidate);
  const latestConflictEnd = conflicts.reduce((m,c)=>Math.max(m,toMin(c.end)), toMin('19:00'));
  const a = findOpenSlot(candidate.date, dur, { afterMin: latestConflictEnd, maxDaysAhead:0, excludeId:candidate.id });
  if(a) opts.push({ id:'A', label:`Shift to ${fmtTime12(a.start)} tonight`, detail:`${fmtDateShort(a.date)} · ${fmtTime12(a.start)}–${fmtTime12(a.end)}`, apply:[{ ...candidate, date:a.date, start:a.start, end:a.end }] });

  // Option B: move to early tomorrow
  const b = findOpenSlot(addDays(candidate.date,1), dur, { afterMin: toMin(state.constraints.noStudyBefore||'07:00'), maxDaysAhead:2, excludeId:candidate.id });
  if(b) opts.push({ id:'B', label:`Move to ${fmtTime12(b.start)} — ${fmtDateShort(b.date)}`, detail:`${fmtDateShort(b.date)} · ${fmtTime12(b.start)}–${fmtTime12(b.end)}`, apply:[{ ...candidate, date:b.date, start:b.start, end:b.end }] });

  // Option C: split into two halves across open slots
  const c1 = findOpenSlot(candidate.date, half, { afterMin: toMin(candidate.start), maxDaysAhead:1, excludeId:candidate.id });
  const c2 = c1 ? findOpenSlot(c1.date, half, { afterMin: toMin(c1.end)+15, maxDaysAhead:1, excludeId:candidate.id }) : null;
  if(c1 && c2){
    opts.push({ id:'C', label:`Split into two ${half}-min sessions`, detail:`${fmtDateShort(c1.date)} ${fmtTime12(c1.start)} + ${fmtDateShort(c2.date)} ${fmtTime12(c2.start)}`,
      apply:[ { ...candidate, id:candidate.id, title:candidate.title+' (Part 1)', date:c1.date, start:c1.start, end:c1.end },
              { ...candidate, id:uid('task'), title:candidate.title+' (Part 2)', date:c2.date, start:c2.start, end:c2.end } ] });
  }

  // Fallback D if we couldn't build 3 — push further out
  while(opts.length < 3){
    const fb = findOpenSlot(candidate.date, dur, { afterMin: toMin('06:00'), maxDaysAhead: 3 + opts.length, excludeId:candidate.id });
    if(!fb) break;
    const key = `${fb.date}_${fb.start}`;
    if(opts.some(o=>o.detail.includes(fmtTime12(fb.start)) && o.detail.includes(fmtDateShort(fb.date)))) break;
    opts.push({ id:String.fromCharCode(65+opts.length), label:`Reschedule to ${fmtDateShort(fb.date)}, ${fmtTime12(fb.start)}`, detail:`${fmtDateShort(fb.date)} · ${fmtTime12(fb.start)}–${fmtTime12(fb.end)}`, apply:[{ ...candidate, date:fb.date, start:fb.start, end:fb.end }] });
  }
  return opts.slice(0,3);
}

// Silent auto-placement used by batch schedulers (lecture tracker / roadmap). Returns {date,start,end} or null.
function autoPlace(preferredDate, durationMin, opts={}){ return findOpenSlot(preferredDate, durationMin, { afterMin: toMin('16:00'), maxDaysAhead:10, ...opts }); }

/* ---------------------------------- PACING SCALE-UP ENGINE ---------------------------------- */
function pacingStatusForRoadmap(rm){
  const days = Math.max(1, dayDiff(todayISO(), rm.examDate));
  const total = rm.topics.length;
  const done = rm.topics.filter(t=>t.done).length;
  const remaining = total - done;
  const remainingHours = rm.topics.filter(t=>!t.done).reduce((s,t)=>s+(t.estimatedHours||1),0);
  const requiredDailyHours = +(remainingHours / days).toFixed(2);
  const expectedDoneByNow = total>0 ? Math.round(total * (1 - days/Math.max(1,dayDiff(rm.createdDate||todayISO(), rm.examDate)))) : 0;
  const behind = done < expectedDoneByNow - 1 || requiredDailyHours > state.constraints.maxStudyHoursPerDay;
  return { days, total, done, remaining, remainingHours, requiredDailyHours, behind };
}

function applyPacingScaleUp(roadmapId){
  const rm = state.roadmaps.find(r=>r.id===roadmapId); if(!rm) return null;
  const status = pacingStatusForRoadmap(rm);
  if(!status.behind) return status;
  const cap = state.constraints.maxStudyHoursPerDay * 60;
  const upcoming = state.tasks.filter(t=>t.roadmapId===roadmapId && t.status==='pending' && t.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date));
  let scaled = 0;
  upcoming.slice(0,4).forEach(t=>{
    const dur = toMin(t.end)-toMin(t.start);
    const newDur = clamp(Math.round(dur*1.4/5)*5, dur, 90);
    if(newDur>dur){
      const dayTotal = tasksOnDate(t.date).filter(x=>x.type==='review').reduce((s,x)=>s+(toMin(x.end)-toMin(x.start)),0);
      if(dayTotal - dur + newDur <= cap){ t.end = toHHMM(toMin(t.start)+newDur); scaled++; }
    }
  });
  if(scaled>0) save();
  return status;
}

function hasApiKey(){ return !!(state.apiKey && state.apiKey.trim().length>4); }

// Anthropic, OpenAI, and DeepSeek are all reachable from the browser and share enough shape
// that only Anthropic needs its own request/response mapping — OpenAI and DeepSeek both speak
// the OpenAI-compatible chat-completions + function-calling wire format.
const PROVIDER_META = {
  anthropic: { label:'Anthropic', defaultModel:'claude-opus-5', keyPlaceholder:'sk-ant-...' },
  openai:    { label:'OpenAI',    defaultModel:'gpt-4o',        keyPlaceholder:'sk-...', endpoint:'https://api.openai.com/v1/chat/completions' },
  deepseek:  { label:'DeepSeek',  defaultModel:'deepseek-chat', keyPlaceholder:'sk-...', endpoint:'https://api.deepseek.com/chat/completions' },
};
function providerLabel(p=state.apiProvider){ return PROVIDER_META[p]?.label || p; }

// Unified call: returns { text, toolCall: {name, input} | null }
async function callAI({ system, messages, tool=null, forceTool=false, maxTokens=1400 }){
  if(!hasApiKey()) throw new Error('NO_KEY');
  if(state.apiProvider === 'anthropic') return callAnthropic({ system, messages, tool, forceTool, maxTokens });
  const meta = PROVIDER_META[state.apiProvider] || PROVIDER_META.openai;
  return callOpenAICompatible(meta.endpoint, meta.label, { system, messages, tool, forceTool, maxTokens });
}

async function callAnthropic({ system, messages, tool, forceTool, maxTokens }){
  const body = {
    model: state.apiModel || 'claude-opus-5',
    max_tokens: maxTokens,
    system,
    messages,
  };
  if(tool){
    body.tools = [TOOLS[tool]];
    body.tool_choice = forceTool ? { type:'tool', name: tool } : { type:'auto' };
  }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': state.apiKey.trim(),
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const errBody = await res.json().catch(()=>({}));
    throw new Error(errBody?.error?.message || `Anthropic API error (${res.status})`);
  }
  const data = await res.json();
  let text = '', toolCall = null;
  for(const block of (data.content||[])){
    if(block.type==='text') text += block.text;
    if(block.type==='tool_use') toolCall = { name: block.name, input: block.input };
  }
  return { text, toolCall, raw:data };
}

// Shared by OpenAI and DeepSeek — both implement the OpenAI chat-completions + tool-calling shape.
async function callOpenAICompatible(endpoint, providerLabelStr, { system, messages, tool, forceTool, maxTokens }){
  const oaMessages = [ { role:'system', content: system }, ...messages.map(m=>({ role: m.role==='assistant'?'assistant':'user', content: m.content })) ];
  const body = { model: state.apiModel || 'gpt-4o', max_tokens: maxTokens, messages: oaMessages };
  if(tool){
    const t = TOOLS[tool];
    body.tools = [{ type:'function', function:{ name:t.name, description:t.description, parameters:t.input_schema } }];
    body.tool_choice = forceTool ? { type:'function', function:{ name: tool } } : 'auto';
  }
  const res = await fetch(endpoint, {
    method:'POST',
    headers:{ 'content-type':'application/json', 'Authorization': `Bearer ${state.apiKey.trim()}` },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    const errBody = await res.json().catch(()=>({}));
    throw new Error(errBody?.error?.message || `${providerLabelStr} API error (${res.status})`);
  }
  const data = await res.json();
  const choice = data.choices?.[0]?.message;
  let toolCall = null;
  if(choice?.tool_calls?.length){
    const tc = choice.tool_calls[0];
    try{ toolCall = { name: tc.function.name, input: JSON.parse(tc.function.arguments) }; }catch(e){ toolCall = null; }
  }
  return { text: choice?.content || '', toolCall, raw:data };
}

function apiErrorMessage(e){
  if(e.message==='NO_KEY') return 'Add your API key in Settings to enable AI features.';
  if(/401|authentic/i.test(e.message)) return 'Your API key was rejected (401). Check it in Settings.';
  if(/429|rate/i.test(e.message)) return 'Rate limited by the AI provider — try again shortly.';
  return `AI request failed: ${e.message}`;
}

/* ---------------------------------- ADAPTIVE SPACED REPETITION ---------------------------------- */

function reEnqueueTopicForReview(topic, courseId, rating){
  // Intervals in days depending on how it went. Struggled -> sooner & more sessions; aced -> longer, lighter check.
  const plans = {
    struggled: [1, 3, 6],
    ok:        [2, 5],
    aced:      [7],
  };
  const days = plans[rating] || [3];
  const course = state.courses.find(c=>c.id===courseId);
  let placed = 0;
  days.forEach((offset, i)=>{
    const dur = rating==='struggled' ? 45 : (rating==='ok' ? 35 : 25);
    const preferred = addDays(todayISO(), offset);
    const slot = autoPlace(preferred, dur, { afterMin: toMin('16:00'), maxDaysAhead:3 });
    if(slot){
      state.tasks.push({ id:uid('task'), title:`Review: ${topic}`, type:'review', courseId: courseId||null, date:slot.date, start:slot.start, end:slot.end, status:'pending', notes: rating==='struggled' ? 'Adaptive follow-up — flagged as a weak area.' : 'Spaced-repetition check-in.', topic, roadmapId:null, createdAt:Date.now(), completedAt:null });
      placed++;
    }
  });
  save();
  return placed;
}

function logPerformance({ topic, rating, note, courseId=null }){
  state.performanceLog.push({ id:uid('perf'), topic, courseId, rating, note: note||'', date: todayISO(), taskId:null });
  const placed = reEnqueueTopicForReview(topic, courseId, rating);
  save();
  return placed;
}

function exportJSON(){

function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.tasks || !Array.isArray(parsed.tasks)) throw new Error('Not a valid Aether backup file.');
      state = Object.assign(defaultState(), parsed);
      save(); render();
      toast('Backup restored successfully.', 'success');
    }catch(e){ toast('Import failed: '+e.message, 'error'); }
  };
  reader.readAsText(file);
}

function icsEscape(s=''){ return String(s).replace(/[\\;,]/g, m=>'\\'+m).replace(/\n/g,'\\n'); }
function icsDate(date, time){ const [Y,M,D]=date.split('-'); const [h,m]=time.split(':'); return `${Y}${M}${D}T${h}${m}00`; }

function exportICS(){
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Aether Study Engine//EN','CALSCALE:GREGORIAN'];
  state.tasks.forEach(t=>{
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${t.id}@aether.local`);
    lines.push(`DTSTAMP:${icsDate(todayISO(), '00:00')}Z`);
    lines.push(`DTSTART:${icsDate(t.date, t.start)}`);
    lines.push(`DTEND:${icsDate(t.date, t.end)}`);
    lines.push(`SUMMARY:${icsEscape(`[${TYPE_META[t.type].short}] ${t.title}`)}`);
    if(t.notes) lines.push(`DESCRIPTION:${icsEscape(t.notes)}`);
    lines.push(`STATUS:${t.status==='completed'?'CONFIRMED':'TENTATIVE'}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], { type:'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `aether-calendar-${todayISO()}.ics`; a.click();
  URL.revokeObjectURL(url);
  toast('Calendar exported as .ics — import into Google/Apple Calendar.', 'success');
}

      <section class="card rounded-2xl p-4 sm:p-5 flex flex-col max-h-[720px]">
        <div class="flex items-center gap-1 bg-base-850/80 border border-white/5 rounded-xl p-1 mb-4 w-full">
          <button data-action="setDashTab" data-tab="tasks" class="flex-1 flex items-center justify-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg transition ${state.dashTab==='tasks'?'bg-indigo-500 text-white':'text-slate-400 hover:text-slate-200'}"><i data-lucide="list-checks" class="w-3.5 h-3.5"></i>Tasks</button>
          <button data-action="setDashTab" data-tab="coach" class="flex-1 flex items-center justify-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg transition ${state.dashTab==='coach'?'bg-indigo-500 text-white':'text-slate-400 hover:text-slate-200'}"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i>AI Assistant</button>
        </div>
        ${state.dashTab==='tasks' ? renderTaskListPanel() : renderInlineCoach()}
      </section>
    </div>
  </div>`;
}

function renderStatsRow(){
  const t = todayISO();
  const todays = tasksOnDate(t);
  const doneToday = todays.filter(x=>x.status==='completed').length;
  const pctToday = todays.length ? Math.round(100*doneToday/todays.length) : 0;
  const upcomingExams = state.roadmaps.slice().sort((a,b)=>a.examDate.localeCompare(b.examDate))[0];
  const weakTopics = state.performanceLog.filter(p=>p.rating==='struggled').slice(-3);
  const studyHoursWeek = state.tasks.filter(t=>t.type==='review' && dayDiff(state.weekAnchor,t.date)>=0 && dayDiff(state.weekAnchor,t.date)<7).reduce((s,x)=>s+(toMin(x.end)-toMin(x.start))/60,0);

  return `
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    <div class="card rounded-2xl p-4">
      <div class="flex items-center justify-between mb-2"><span class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold">Today's Progress</span><i data-lucide="target" class="w-4 h-4 text-indigo-400"></i></div>
      <div class="text-2xl font-extrabold">${pctToday}%</div>
      <div class="text-[11px] text-slate-400 mt-1">${doneToday}/${todays.length} tasks completed</div>
      <div class="h-1.5 rounded-full bg-white/5 mt-2 overflow-hidden"><div class="h-full bg-gradient-to-r from-indigo-500 to-violet-500" style="width:${pctToday}%"></div></div>
    </div>
    <div class="card rounded-2xl p-4">
      <div class="flex items-center justify-between mb-2"><span class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold">Next Deadline</span><i data-lucide="alarm-clock" class="w-4 h-4 text-rose-400"></i></div>
      ${upcomingExams ? `<div class="text-sm font-bold truncate">${esc(upcomingExams.examName)}</div><div class="text-[11px] text-slate-400 mt-1">${Math.max(0,dayDiff(t,upcomingExams.examDate))} days away · ${fmtDateShort(upcomingExams.examDate)}</div>` : `<div class="text-sm text-slate-500 mt-1">No roadmap yet</div>`}
    </div>
    <div class="card rounded-2xl p-4">
      <div class="flex items-center justify-between mb-2"><span class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold">Review Hours (wk)</span><i data-lucide="brain-circuit" class="w-4 h-4 text-violet-400"></i></div>
      <div class="text-2xl font-extrabold">${studyHoursWeek.toFixed(1)}h</div>
      <div class="text-[11px] text-slate-400 mt-1">cap ${state.constraints.maxStudyHoursPerDay}h/day</div>
    </div>
    <div class="card rounded-2xl p-4">
      <div class="flex items-center justify-between mb-2"><span class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold">Weak Areas</span><i data-lucide="flame" class="w-4 h-4 text-amber-400"></i></div>
      ${weakTopics.length ? `<div class="flex flex-wrap gap-1 mt-1">${weakTopics.map(w=>`<span class="chip bg-amber-500/10 text-amber-300 border border-amber-500/20">${esc(w.topic)}</span>`).join('')}</div>` : `<div class="text-sm text-slate-500 mt-1">None flagged</div>`}
    </div>
  </div>`;
}

function renderTaskListPanel(){
  const groups = {};
  const upcoming = state.tasks.slice().filter(t=>dayDiff(todayISO(),t.date) >= -1).sort((a,b)=> a.date===b.date ? toMin(a.start)-toMin(b.start) : a.date.localeCompare(b.date));
  upcoming.forEach(t=>{ (groups[t.date] ||= []).push(t); });
  const dates = Object.keys(groups).sort().slice(0,8);
  return `
  <div class="flex-1 overflow-y-auto no-scrollbar pr-1 space-y-4">
    ${dates.length===0 ? emptyState('list-x','No tasks yet','Create a task or generate a roadmap to get started.') : dates.map(d=>`
      <div>
        <div class="text-[11px] font-bold uppercase tracking-wide text-slate-400 mb-2 sticky top-0 flex items-center gap-2">
          ${d===todayISO()?'Today':fmtDateLong(d)}
          <span class="h-px flex-1 bg-white/5"></span>
        </div>
        <div class="space-y-2">${groups[d].map(taskListRow).join('')}</div>
      </div>
    `).join('')}
  </div>`;
}

function taskListRow(t){
  const meta = TYPE_META[t.type];
  const course = state.courses.find(c=>c.id===t.courseId);
  const done = t.status==='completed';
  return `
  <div class="group flex items-center gap-3 p-2.5 rounded-xl border border-white/5 hover:border-white/10 bg-white/[0.02] hover:bg-white/[0.04] transition ${done?'opacity-50':''}" data-task-row="${t.id}">
    <button data-action="toggleTaskStatus" data-id="${t.id}" class="shrink-0 w-5 h-5 rounded-full border-2 ${done?'bg-emerald-500 border-emerald-500':'border-slate-500 hover:border-indigo-400'} flex items-center justify-center transition">
      ${done ? '<i data-lucide="check" class="w-3 h-3 text-white"></i>' : ''}
    </button>
    <div class="w-1.5 h-8 rounded-full shrink-0" style="background:${meta.color}"></div>
    <div class="min-w-0 flex-1 cursor-pointer" data-action="openTaskModal" data-id="${t.id}">
      <div class="text-sm font-semibold truncate ${done?'line-through decoration-emerald-400/60':''}">${esc(t.title)}</div>
      <div class="text-[11px] text-slate-400 flex items-center gap-1.5 mt-0.5">
        <i data-lucide="clock" class="w-3 h-3"></i>${fmtTime12(t.start)}–${fmtTime12(t.end)}
        ${course?`<span class="text-slate-600">·</span><span class="truncate">${esc(course.name)}</span>`:''}
      </div>
    </div>
    <span class="chip shrink-0" style="background:${meta.color}22;color:${meta.color};border:1px solid ${meta.color}40">${meta.short}</span>
  </div>`;
}

function renderInlineCoach(){
  return `
  <div class="flex-1 flex flex-col min-h-0">
    ${chatMessagesMarkup(true)}
    ${chatInputMarkup(true)}
  </div>`;
}

function emptyState(icon, title, sub){
  return `<div class="flex flex-col items-center justify-center text-center py-10 text-slate-500">
    <i data-lucide="${icon}" class="w-8 h-8 mb-2 opacity-50"></i>
    <div class="text-sm font-semibold text-slate-400">${title}</div>
    <div class="text-xs mt-1 max-w-[220px]">${sub}</div>
  </div>`;
}

/* ---------------------------------- WEEKLY GRID VIEW ---------------------------------- */

function renderWeeklyView(){
  return `
  <div class="animate-fade-in card rounded-2xl p-4 sm:p-5">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <h2 class="text-base font-bold flex items-center gap-2"><i data-lucide="calendar-days" class="w-5 h-5 text-indigo-400"></i>7-Day Weekly Grid</h2>
      <div class="flex items-center gap-2">
        <button data-action="shiftWeek" data-dir="-1" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <div class="text-sm font-semibold text-slate-300 px-2 min-w-[150px] text-center">${fmtDateShort(state.weekAnchor)} – ${fmtDateShort(addDays(state.weekAnchor,6))}</div>
        <button data-action="shiftWeek" data-dir="1" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        <button data-action="gotoToday" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 ml-1">Today</button>
      </div>
    </div>
    ${legendMarkup()}
    ${weeklyGridMarkup(state.weekAnchor, false)}
  </div>`;
}

function legendMarkup(){
  return `<div class="flex flex-wrap items-center gap-2 mb-4">
    ${TYPE_ORDER.map(k=>`<span class="chip flex items-center gap-1.5" style="background:${TYPE_META[k].color}18;color:${TYPE_META[k].color};border:1px solid ${TYPE_META[k].color}35"><span class="w-1.5 h-1.5 rounded-full" style="background:${TYPE_META[k].color}"></span>${TYPE_META[k].label}</span>`).join('')}
    <span class="chip bg-white/5 text-slate-400 border border-white/10 border-dashed ml-1">Dashed = flexible</span>
  </div>`;
}

function weeklyGridMarkup(anchor, compact){
  const days = Array.from({length:7}, (_,i)=>addDays(anchor,i));
  const hourStart = DAY_START_H, hourEnd = DAY_END_H;
  const totalH = (hourEnd-hourStart)*HOUR_PX;
  const rowH = compact ? HOUR_PX*0.72 : HOUR_PX;
  const gridTotalH = (hourEnd-hourStart)*rowH;

  return `
  <div class="overflow-x-auto no-scrollbar -mx-1">
    <div class="min-w-[720px] px-1">
      <div class="grid grid-cols-[44px_repeat(7,1fr)] gap-0">
        <div></div>
        ${days.map(d=>`
          <div class="text-center pb-2 ${d===todayISO()?'text-indigo-300':'text-slate-400'}">
            <div class="text-[10px] uppercase font-bold tracking-wide">${weekdayLetter(d)}</div>
            <button data-action="viewDay" data-date="${d}" class="text-sm font-extrabold mt-0.5 w-7 h-7 rounded-full mx-auto flex items-center justify-center hover:bg-white/10 transition ${d===todayISO()?'bg-indigo-500 text-white':''}">${d.slice(8)}</button>
          </div>`).join('')}
      </div>
      <div class="grid grid-cols-[44px_repeat(7,1fr)] gap-0 relative" style="height:${gridTotalH}px">
        <div class="relative">
          ${Array.from({length:hourEnd-hourStart}, (_,i)=>`<div class="absolute right-1 -translate-y-2 text-[10px] text-slate-500 font-medium" style="top:${i*rowH}px">${fmtTime12(toHHMM((hourStart+i)*60)).replace(':00','')}</div>`).join('')}
        </div>
        ${days.map(d=>dayColumnMarkup(d, hourStart, hourEnd, rowH, compact)).join('')}
      </div>
    </div>
  </div>`;
}

function dayColumnMarkup(date, hourStart, hourEnd, rowH, compact){
  const dayTasks = tasksOnDate(date);
  const isToday = date===todayISO();
  const nowMin = isToday ? (new Date().getHours()*60+new Date().getMinutes()) : null;
  return `
  <div class="relative border-l border-white/5 ${isToday?'bg-indigo-500/[0.04]':''}" data-drop-date="${date}">
    ${Array.from({length:hourEnd-hourStart}, (_,i)=>`<div class="grid-hourline absolute inset-x-0" style="top:${i*rowH}px;height:${rowH}px"></div>`).join('')}
    ${isToday && nowMin!=null && nowMin>=hourStart*60 && nowMin<=hourEnd*60 ? `<div class="absolute inset-x-0 h-px bg-rose-400 z-10" style="top:${((nowMin-hourStart*60)/60)*rowH}px"><div class="w-1.5 h-1.5 rounded-full bg-rose-400 -mt-[3px] -ml-0.5"></div></div>` : ''}
    ${dayTasks.map(t=>weekBlockMarkup(t, hourStart, rowH, compact)).join('')}
  </div>`;
}

function weekBlockMarkup(t, hourStart, rowH, compact){
  const meta = TYPE_META[t.type];
  const startMin = toMin(t.start) - hourStart*60;
  const durMin = Math.max(15, toMin(t.end)-toMin(t.start));
  const top = (startMin/60)*rowH;
  const height = Math.max(compact?14:18, (durMin/60)*rowH - 2);
  const done = t.status==='completed';
  return `
  <button data-action="openTaskModal" data-id="${t.id}" class="task-block absolute left-0.5 right-0.5 rounded-md sm:rounded-lg text-left px-1.5 py-1 overflow-hidden ${done?'opacity-45':''}"
    style="top:${top}px; height:${height}px; background:${meta.color}${done?'14':'22'}; border:1px ${meta.fixed?'solid':'dashed'} ${meta.color}55;">
    <div class="text-[9px] sm:text-[10px] font-bold truncate leading-tight flex items-center gap-1" style="color:${meta.color}">
      ${done?'<i data-lucide=\"check-circle-2\" class=\"w-2.5 h-2.5\"></i>':''}${esc(t.title)}
    </div>
    ${height>26?`<div class="text-[9px] text-slate-300/80 truncate leading-tight">${fmtTime12(t.start)}</div>`:''}
  </button>`;
}

/* ---------------------------------- DAILY TIMELINE VIEW ---------------------------------- */

function renderDailyView(){
  const date = state.selectedDate;
  const tasks = tasksOnDate(date);
  const hours = Array.from({length: DAY_END_H-DAY_START_H}, (_,i)=>DAY_START_H+i);
  return `
  <div class="animate-fade-in card rounded-2xl p-4 sm:p-5 max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-1">
      <button data-action="shiftDay" data-dir="-1" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
      <div class="text-center">
        <div class="text-base font-extrabold">${date===todayISO()?'Today':fmtDateLong(date)}</div>
        <div class="text-[11px] text-slate-400">${fmtDateLong(date)}</div>
      </div>
      <button data-action="shiftDay" data-dir="1" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
    </div>
    <div class="flex justify-center mb-4">
      <button data-action="gotoToday" class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-white/5 hover:bg-white/10 border border-white/10">Jump to today</button>
    </div>
    ${legendMarkup()}
    <div class="divide-y divide-white/5 border-t border-b border-white/5">
      ${hours.map(h=>dailyHourRow(h, tasks)).join('')}
    </div>
  </div>`;
}

function dailyHourRow(h, tasks){
  const hStart = h*60, hEnd = h*60+60;
  const rowTasks = tasks.filter(t=> toMin(t.start) < hEnd && toMin(t.end) > hStart && toMin(t.start) >= hStart);
  const spilling = tasks.filter(t=> toMin(t.start) < hStart && toMin(t.end) > hStart);
  return `
  <div class="flex gap-3 py-2.5 min-h-[52px]">
    <div class="w-14 shrink-0 text-right text-[11px] font-semibold text-slate-500 pt-0.5">${fmtTime12(toHHMM(hStart)).replace(':00','')}</div>
    <div class="flex-1 space-y-1.5">
      ${spilling.map(t=>`<div class="text-[10px] text-slate-500 italic pl-2 border-l-2" style="border-color:${TYPE_META[t.type].color}55">↳ continues: ${esc(t.title)}</div>`).join('')}
      ${rowTasks.length===0 && spilling.length===0 ? `<div class="h-6"></div>` : rowTasks.map(dailyTaskCard).join('')}
    </div>
  </div>`;
}

function dailyTaskCard(t){
  const meta = TYPE_META[t.type];
  const done = t.status==='completed';
  const course = state.courses.find(c=>c.id===t.courseId);
  return `
  <div data-action="openTaskModal" data-id="${t.id}" role="button" tabindex="0" class="task-block cursor-pointer w-full text-left rounded-xl px-3 py-2 flex items-center gap-2.5 ${done?'opacity-50':''}" style="background:${meta.color}14; border:1px ${meta.fixed?'solid':'dashed'} ${meta.color}45;">
    <button data-action="toggleTaskStatus" data-id="${t.id}" data-stop="1" class="shrink-0 w-5 h-5 rounded-full border-2 ${done?'bg-emerald-500 border-emerald-500':'border-slate-500'} flex items-center justify-center">${done?'<i data-lucide="check" class="w-3 h-3 text-white"></i>':''}</button>
    <i data-lucide="${meta.icon}" class="w-4 h-4 shrink-0" style="color:${meta.color}"></i>
    <div class="min-w-0 flex-1">
      <div class="text-sm font-semibold truncate ${done?'line-through':''}">${esc(t.title)}</div>
      <div class="text-[11px] text-slate-400">${fmtTime12(t.start)}–${fmtTime12(t.end)}${course?` · ${esc(course.name)}`:''}</div>
    </div>
    <span class="chip shrink-0" style="background:${meta.color}22;color:${meta.color}">${meta.short}</span>
  </div>`;
}

function renderChatDrawer(){
  return `
  <div id="chatOverlay" data-action="toggleChat" class="fixed inset-0 bg-black/50 z-40 ${chatOpen?'':'hidden'}"></div>
  <aside id="chatDrawer" class="fixed top-0 right-0 h-full w-full sm:w-[420px] z-50 glass border-l border-white/10 ${chatOpen?'':'translate-x-full'} transition-transform duration-300 flex flex-col">

          <div class="text-sm font-bold leading-none">AI Coach</div>
          <div class="text-[10px] ${hasApiKey()?'text-emerald-400':'text-slate-500'} mt-0.5">${hasApiKey()?'Connected · '+providerLabel():'No API key set'}</div>

function chatMessagesMarkup(inline){

  <div id="${inline?'chatMsgsInline':'chatMsgsDrawer'}" class="${h} overflow-y-auto no-scrollbar px-1 ${inline?'':'px-4'} py-3 space-y-3">

function chatBubble(m){

    <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-sm leading-relaxed ${mine? 'bg-indigo-500 text-white rounded-br-md':'bg-white/[0.06] border border-white/10 rounded-bl-md'}">

function chatInputMarkup(inline){
  const idInput = inline?'chatInputInline':'chatInputDrawer';

    <div class="flex items-end gap-2">
      <textarea id="${idInput}" rows="1" placeholder="Log how a session went, or ask for help…" class="flex-1 resize-none bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 placeholder:text-slate-500"></textarea>
      <button data-action="sendChat" data-source="${inline?'inline':'drawer'}" class="w-10 h-10 shrink-0 rounded-xl bg-indigo-500 hover:bg-indigo-400 flex items-center justify-center transition"><i data-lucide="send" class="w-4 h-4 text-white"></i></button>
    </div>
  </div>`;
}

    <input id="pinInput" type="password" value="${esc(localPin)}" placeholder="e.g. 4–8 digits or a short word" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 mb-1 font-mono" autocomplete="off">
    <p class="text-[11px] text-slate-500 mb-4">Stored only in this browser — never saved to the shared code or database.</p>
    <div class="flex gap-2">
      <button data-action="savePin" class="flex-1 bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-bold py-2.5 rounded-xl transition">Save & Unlock</button>
      ${localPin?`<button data-action="clearPin" class="px-4 rounded-xl bg-rose-500/10 text-rose-300 border border-rose-500/20 hover:bg-rose-500/15 text-sm font-semibold">Forget</button>`:''}
    </div>
    ${localPin ? `
    <div class="mt-5 pt-4 border-t border-white/10">
      <label class="block text-xs font-semibold text-slate-300 mb-1.5">Change the Shared PIN</label>

/* ============================================================================================
   ACTIONS
   ============================================================================================ */

function openModal(id){ const el = document.getElementById(id); if(el){ el.classList.add('open'); } }
function closeModal(id){ const el = document.getElementById(id); if(el){ el.classList.remove('open'); } }

const actions = {
  setView(el){ state.view = el.dataset.view; if(state.view==='daily') state.selectedDate = state.selectedDate; save(); render(); },
  setDashTab(el){ state.dashTab = el.dataset.tab; save(); render(); },
  viewDay(el){ state.selectedDate = el.dataset.date; state.view='daily'; save(); render(); },
  shiftWeek(el){ state.weekAnchor = addDays(state.weekAnchor, 7*Number(el.dataset.dir)); save(); render(); },
  shiftDay(el){ state.selectedDate = addDays(state.selectedDate, Number(el.dataset.dir)); save(); render(); },
  gotoToday(){ state.selectedDate = todayISO(); state.weekAnchor = todayISO(); save(); render(); },

  toggleChat(){ chatOpen = !chatOpen; render(); if(chatOpen) scrollChatToBottom(); },

  openSettingsModal(){ closeAllModals(); openModal('settingsModal'); },
  openApiSetupModal(){ closeAllModals(); openModal('apiSetupModal'); },
  openPinModal(){ closeAllModals(); openModal('pinModal'); },
  openTaskModal(el){ closeAllModals(); prepareTaskModal(el?.dataset?.id); openModal('taskModal'); },
  openLectureModal(){ closeAllModals(); openModal('lectureModal'); },
  openRoadmapModal(){ closeAllModals(); openModal('roadmapModal'); },

  closeModal(el){ closeModal(el.dataset.id); },

  setProvider(el){
    state.apiProvider = el.dataset.provider;
    state.apiModel = PROVIDER_META[state.apiProvider]?.defaultModel || 'gpt-4o';
    save();
    const root = $('#apiSetupModal'); if(root){ root.outerHTML = apiSetupModalMarkup(); openModal('apiSetupModal'); lucide.createIcons(); bindGlobalOnce(true); }
  },
  saveApiKey(){
    state.apiKey = $('#apiKeyInput').value.trim();
    state.apiModel = $('#apiModelInput').value.trim() || state.apiModel;
    save();
    if(localPin){ pushSharedSecrets(); toast(hasApiKey() ? 'AI engine connected — synced to everyone with the PIN.' : 'API key cleared for everyone with the PIN.', hasApiKey()?'success':'info'); }
    else toast(hasApiKey() ? 'AI engine connected (this device only — unlock the shared workspace to sync it).' : 'API key cleared.', hasApiKey()?'success':'info');
    closeModal('apiSetupModal'); render();
  },
  clearApiKey(){ state.apiKey=''; save(); if(localPin) pushSharedSecrets(); toast('API key removed.'); closeModal('apiSetupModal'); render(); },

  savePin(){
    const v = $('#pinInput').value.trim();
    if(!v){ toast('Enter a PIN first.', 'warn'); return; }
    saveLocalPin(v);
    closeModal('pinModal');
    toast('PIN saved — retrying sync…', 'info');
    queueCloudPush(true);
    loadSharedSecrets();
    render();
  },
  clearPin(){ saveLocalPin(''); setCloudStatus('locked'); closeModal('pinModal'); toast('PIN forgotten on this device — you can still view shared data, not edit it.'); render(); },
  changePin(){
    const newPin = $('#newPinInput').value.trim();
    if(!newPin){ toast('Enter a new PIN first.', 'warn'); return; }
    if(!sb || !localPin){ toast('Unlock with your current PIN first.', 'warn'); return; }
    sb.rpc('change_shared_pin', { old_pin: localPin, new_pin: newPin }).then(({error})=>{
      if(error){ toast('Could not change the PIN — your current PIN may be wrong, or sync is offline.', 'error'); return; }
      saveLocalPin(newPin);
      closeModal('pinModal');
      toast('PIN changed. Share the new one with anyone who needs edit access — the old PIN no longer works.', 'success');
      render();
    });
  },

  saveConstraints(){
    state.constraints.maxStudyHoursPerDay = Number($('#cMaxHours').value);
    state.constraints.noStudyBefore = $('#cBefore').value;
    state.constraints.noStudyAfter = $('#cAfter').value;
    state.constraints.preserveWorkout = $('#cPreserveWorkout').checked;
    save(); toast('Settings saved.', 'success'); closeModal('settingsModal'); render();
  },
  addCourse(){
    const name = $('#newCourseName').value.trim(); if(!name) return;
    const palette = ['#818cf8','#fb7185','#38bdf8','#34d399','#fbbf24','#a78bfa','#f472b6'];
    state.courses.push({ id: uid('course'), name, color: palette[state.courses.length % palette.length] });
    save(); const root=$('#settingsModal'); root.outerHTML = settingsModalMarkup(); openModal('settingsModal'); lucide.createIcons(); bindGlobalOnce(true);
  },
  deleteCourse(el){ state.courses = state.courses.filter(c=>c.id!==el.dataset.id); save(); const root=$('#settingsModal'); root.outerHTML = settingsModalMarkup(); openModal('settingsModal'); lucide.createIcons(); bindGlobalOnce(true); },

  exportJSON(){ exportJSON(); },
  exportICS(){ exportICS(); },

  pickTaskType(el){
    $$('.task-type-btn').forEach(b=>b.dataset.selected='false');
    el.dataset.selected='true';
    $('#taskTypeGrid').dataset.value = el.dataset.type;
    applyTaskTypeStyles();
  },

  toggleTaskDone(){ const id=$('#taskId').value; if(id) actions.toggleTaskStatus({dataset:{id}}); closeModal('taskModal'); },
  deleteTask(){ const id=$('#taskId').value; if(id){ state.tasks = state.tasks.filter(t=>t.id!==id); save(); toast('Task deleted.'); closeModal('taskModal'); render(); } },

  toggleTaskStatus(el){
    const t = state.tasks.find(x=>x.id===el.dataset.id); if(!t) return;
    t.status = t.status==='completed' ? 'pending' : 'completed';
    t.completedAt = t.status==='completed' ? Date.now() : null;
    if(t.status==='completed' && t.type==='review' && t.roadmapId){
      const rm = state.roadmaps.find(r=>r.id===t.roadmapId);
      if(rm && t.topic){ const top = rm.topics.find(x=>x.name===t.topic); if(top) top.done = true; }
    }
    save(); render();
    if(t.status==='completed') toast(`Marked "${t.title}" as complete.`, 'success');
  },

  deleteRoadmap(el){ state.roadmaps = state.roadmaps.filter(r=>r.id!==el.dataset.id); state.tasks = state.tasks.filter(t=>t.roadmapId!==el.dataset.id); save(); toast('Roadmap removed.'); const root=$('#roadmapModal'); root.outerHTML = roadmapModalMarkup(); openModal('roadmapModal'); lucide.createIcons(); bindGlobalOnce(true); },
  applyPacing(el){ const s = applyPacingScaleUp(el.dataset.id); toast(s.behind?`Scaled up upcoming sessions — targeting ${s.requiredDailyHours}h/day.`:'Already on pace.', 'success'); const root=$('#roadmapModal'); root.outerHTML = roadmapModalMarkup(); openModal('roadmapModal'); lucide.createIcons(); bindGlobalOnce(true); render(); },

  cancelConflict(){ pendingConflict = null; closeModal('conflictModal'); },
  applyConflictOption(el){
    if(!pendingConflict) return;
    const opt = pendingConflict.options[Number(el.dataset.opt)];
    const isNew = pendingConflict.isNew;
    // remove any existing version of candidate.id from state (in case editing)
    state.tasks = state.tasks.filter(t=>t.id!==pendingConflict.candidate.id);
    opt.apply.forEach(task=> state.tasks.push(task));
    save();
    toast('Task rescheduled — conflict resolved.', 'success');
    pendingConflict = null;
    closeModal('conflictModal');
    render();
  },

  sendChat(el){ handleSendChat(el.dataset.source); },
};

function applyTaskTypeStyles(){
  $$('.task-type-btn').forEach(b=>{
    const sel = b.dataset.selected==='true';
    b.style.background = sel ? 'color-mix(in srgb, var(--c) 22%, transparent)' : 'rgba(255,255,255,0.03)';
    b.style.borderColor = sel ? 'color-mix(in srgb, var(--c) 55%, transparent)' : 'rgba(255,255,255,0.08)';
    b.style.color = sel ? 'var(--c)' : '#94a3b8';
  });
}

function closeAllModals(){ $$('[data-modal]').forEach(m=>m.classList.remove('open')); }

/* ---------------------------------- TASK MODAL LOGIC ---------------------------------- */

function prepareTaskModal(id){
  const isEdit = !!id;
  const t = isEdit ? state.tasks.find(x=>x.id===id) : null;
  $('#taskId').value = t?.id || '';
  $('#taskTitle').value = t?.title || '';
  $('#taskDate').value = t?.date || state.selectedDate || todayISO();
  $('#taskStart').value = t?.start || '09:00';
  $('#taskEnd').value = t?.end || '10:00';
  $('#taskCourse').value = t?.courseId || '';
  $('#taskNotes').value = t?.notes || '';
  $$('.task-type-btn').forEach(b=> b.dataset.selected = (b.dataset.type === (t?.type||'personal')) ? 'true':'false');
  $('#taskTypeGrid').dataset.value = t?.type || 'personal';
  applyTaskTypeStyles();
  $('#taskDoneBtn').classList.toggle('hidden', !isEdit);
  $('#taskDeleteBtn').classList.toggle('hidden', !isEdit);
  if(isEdit) $('#taskDoneBtn').textContent = t.status==='completed' ? 'Mark Pending' : 'Mark Done';
  $('#taskModal h3').innerHTML = `<i data-lucide="calendar-plus" class="w-4 h-4 text-indigo-400"></i>${isEdit?'Edit Task':'New Task'}`;
  lucide.createIcons();
}

function handleTaskFormSubmit(e){
  e.preventDefault();
  const id = $('#taskId').value || uid('task');
  const type = $('#taskTypeGrid').dataset.value || 'personal';
  const candidate = {
    id, title: $('#taskTitle').value.trim() || 'Untitled Task',
    type, courseId: $('#taskCourse').value || null,
    date: $('#taskDate').value || todayISO(),
    start: $('#taskStart').value || '09:00',
    end: $('#taskEnd').value || '10:00',
    status: state.tasks.find(t=>t.id===id)?.status || 'pending',
    notes: $('#taskNotes').value || '',
    topic: state.tasks.find(t=>t.id===id)?.topic || '',
    roadmapId: state.tasks.find(t=>t.id===id)?.roadmapId || null,
    createdAt: state.tasks.find(t=>t.id===id)?.createdAt || Date.now(),
    completedAt: state.tasks.find(t=>t.id===id)?.completedAt || null,
  };
  if(toMin(candidate.end) <= toMin(candidate.start)){ toast('End time must be after start time.', 'error'); return; }

  const conflicts = findConflicts(candidate).filter(c => typeWeight(c) >= typeWeight(candidate));
  if(conflicts.length){
    const options = generateConflictOptions(candidate);
    pendingConflict = { candidate, options, blockers: conflicts, isNew: !state.tasks.some(t=>t.id===id) };
    closeModal('taskModal');
    const root = $('#conflictModal'); root.outerHTML = conflictModalMarkup(); openModal('conflictModal'); lucide.createIcons(); bindGlobalOnce(true);
    return;
  }

  const idx = state.tasks.findIndex(t=>t.id===id);
  if(idx>=0) state.tasks[idx] = candidate; else state.tasks.push(candidate);
  save();
  toast(idx>=0 ? 'Task updated.' : 'Task created.', 'success');
  closeModal('taskModal');
  render();
}

/* ---------------------------------- POST-LECTURE FLOW ---------------------------------- */

let lectureAttachedText = '';

function readFileAsText(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}
function readFileAsArrayBuffer(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsArrayBuffer(file);
  });
}

async function extractPdfText(file){
  if(typeof pdfjsLib === 'undefined') throw new Error('PDF parser did not load — check your connection and try again.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const buf = await readFileAsArrayBuffer(file);
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  const maxPages = Math.min(pdf.numPages, 40); // guard against huge scanned textbooks
  for(let i=1; i<=maxPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text.trim();
}

async function extractDocxText(file){
  if(typeof mammoth === 'undefined') throw new Error('DOCX parser did not load — check your connection and try again.');
  const buf = await readFileAsArrayBuffer(file);
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return (result.value || '').trim();
}

async function handleLectureFileChange(e){
  const file = e.target.files[0]; if(!file) return;
  const label = $('#lectureFileLabel');
  const ext = file.name.split('.').pop().toLowerCase();
  label.textContent = `Parsing ${file.name}…`;
  try{
    let text = '';
    if(ext === 'pdf') text = await extractPdfText(file);
    else if(ext === 'docx') text = await extractDocxText(file);
    else text = await readFileAsText(file); // .txt, .md, and other plain-text fallbacks
    if(!text) throw new Error('No readable text found in this file (it may be a scanned/image-only document).');
    lectureAttachedText = text;
    label.textContent = `✓ ${file.name} (${text.length.toLocaleString()} chars extracted)`;
  }catch(err){
    console.error('Lecture file parse failed', err);
    label.textContent = 'Click to attach a .pdf, .docx, or .txt file';
    lectureAttachedText = '';
    toast(`Couldn't read ${file.name}: ${err.message}`, 'error');
  }
}

async function handleSubmitLecture(){
  const courseId = $('#lectureCourse').value || null;
  const course = state.courses.find(c=>c.id===courseId);
  const text = ($('#lectureText').value || '') + (lectureAttachedText ? '\n\n'+lectureAttachedText : '');
  if(!text.trim()){ toast('Add what you covered, or attach notes, first.', 'warn'); return; }

  const btn = $('[data-action="submitLecture"]'); const label = $('#lectureSubmitLabel');
  btn.disabled = true; label.textContent = 'Analyzing…';

  let topics = [];
  try{
    if(hasApiKey()){
      const result = await aiExtractTopics({ courseName: course?.name, coverageText: text });
      topics = (result.topics||[]).slice(0,8);
    } else {
      topics = text.split(/[,\n;]/).map(s=>s.trim()).filter(Boolean).slice(0,8);
      if(topics.length===0) topics = [text.trim().slice(0,60)];
    }
  }catch(err){
    toast(apiErrorMessage(err), 'error');
    topics = text.split(/[,\n;]/).map(s=>s.trim()).filter(Boolean).slice(0,8);
  }

  let scheduled = 0, conflictsResolved = 0;
  const spacing = [1,3,7]; // days out — eliminates cramming
  topics.forEach((topic, ti)=>{
    spacing.forEach((offset, si)=>{
      const dur = si===0 ? 40 : 25;
      const preferred = addDays(todayISO(), offset);
      const slot = autoPlace(preferred, dur, { afterMin: toMin('16:00'), maxDaysAhead: 4 });
      if(slot){
        state.tasks.push({ id:uid('task'), title:`Review: ${topic}`, type:'review', courseId, date:slot.date, start:slot.start, end:slot.end, status:'pending', notes:`Auto-scheduled from lecture coverage on ${todayISO()}.`, topic, roadmapId:null, createdAt:Date.now(), completedAt:null });
        scheduled++;
      } else conflictsResolved++;
    });
  });
  save();
  btn.disabled = false; label.textContent = 'Generate Review Schedule';
  lectureAttachedText='';
  closeModal('lectureModal');
  toast(`${scheduled} review sessions scheduled across the next 7 days for: ${topics.slice(0,4).join(', ')}${topics.length>4?'…':''}`, 'success');
  render();
}

/* ---------------------------------- ROADMAP FLOW ---------------------------------- */

async function handleSubmitRoadmap(){
  const goal = $('#rmGoal').value.trim();
  const examDate = $('#rmDate').value;
  const institution = $('#rmInstitution').value.trim();
  const notes = $('#rmNotes').value.trim();
  if(!goal || !examDate){ toast('Add a goal and target date.', 'warn'); return; }

  const btn = $('[data-action="submitRoadmap"]'); const label = $('#roadmapSubmitLabel');
  btn.disabled = true; label.textContent = 'Building roadmap…';

  let data;
  try{
    if(hasApiKey()){
      data = await aiGenerateRoadmap({ goal, examDate, institution, courseNotes: notes });
    } else {
      data = { summary:'Rule-based starter plan (add an API key for a tailored AI roadmap).', topics: Array.from({length:8},(_,i)=>({ name:`${goal} — Topic ${i+1}`, estimated_hours: 3, priority: i<3?'high':(i<6?'medium':'low') })) };
    }
  }catch(err){
    toast(apiErrorMessage(err), 'error');
    btn.disabled=false; label.textContent='Generate Roadmap';
    return;
  }

  const rm = { id: uid('roadmap'), examName: goal, examDate, institution, createdDate: todayISO(), summary: data.summary||'', topics: (data.topics||[]).map(t=>({ name:t.name, estimatedHours: t.estimated_hours||2, priority: t.priority||'medium', done:false })) };
  state.roadmaps.push(rm);

  // Pace topics across the available window, front-loading high priority.
  const days = Math.max(1, dayDiff(todayISO(), examDate));
  const sorted = rm.topics.slice().sort((a,b)=> ({high:0,medium:1,low:2}[a.priority]-{high:0,medium:1,low:2}[b.priority]));
  const dailyCapMin = state.constraints.maxStudyHoursPerDay*60;
  let cursorDay = 0, placed=0;
  sorted.forEach((topic)=>{
    const sessions = Math.max(1, Math.ceil((topic.estimatedHours*60) / 45));
    for(let s=0;s<sessions;s++){
      const preferredOffset = clamp(cursorDay, 0, Math.max(0,days-1));
      const preferred = addDays(todayISO(), preferredOffset);
      const slot = autoPlace(preferred, 45, { afterMin: toMin('16:00'), maxDaysAhead: Math.max(1,days) });
      if(slot){
        state.tasks.push({ id:uid('task'), title:`Study: ${topic.name}`, type:'review', courseId:null, date:slot.date, start:slot.start, end:slot.end, status:'pending', notes:`Part of roadmap: ${rm.examName}`, topic:topic.name, roadmapId: rm.id, createdAt:Date.now(), completedAt:null });
        placed++;
      }
      cursorDay += Math.max(1, Math.floor(days / (rm.topics.length*sessions || 1)));
    }
  });

  save();
  btn.disabled = false; label.textContent = 'Generate Roadmap';
  $('#rmGoal').value=''; $('#rmNotes').value='';
  toast(`Roadmap "${rm.examName}" created — ${placed} study sessions scheduled through ${fmtDateShort(examDate)}.`, 'success');
  const root = $('#roadmapModal'); root.outerHTML = roadmapModalMarkup(); openModal('roadmapModal'); lucide.createIcons(); bindGlobalOnce(true);
  render();
}

/* ---------------------------------- CHAT FLOW ---------------------------------- */

async function handleSendChat(source){
  const inputId = source==='inline' ? 'chatInputInline' : 'chatInputDrawer';
  const input = $('#'+inputId); if(!input) return;
  const text = input.value.trim(); if(!text) return;
  input.value='';
  state.chat.push({ role:'user', content:text, ts:Date.now() });
  save(); render();
  scrollChatToBottom();
  if(source==='drawer' && !chatOpen){ chatOpen = true; }

  if(!hasApiKey()){
    state.chat.push({ role:'assistant', content:"I need an API key to think — open Settings and connect Anthropic or OpenAI, and I'll take it from there.", ts:Date.now() });
    save(); render(); scrollChatToBottom();
    return;
  }

  const thinkingMsg = { role:'assistant', content:'…', ts:Date.now(), thinking:true };
  state.chat.push(thinkingMsg); render(); scrollChatToBottom();

  try{
    const { text: reply, toolCall } = await aiChat(text);
    state.chat.pop(); // remove thinking bubble
    let placedNote = '';
    if(toolCall && toolCall.name==='log_performance'){
      const course = state.courses.find(c=> toolCall.input.topic && c.name.toLowerCase().includes(toolCall.input.topic.toLowerCase().split(' ')[0]));
      const placed = logPerformance({ topic: toolCall.input.topic, rating: toolCall.input.rating, note: toolCall.input.note, courseId: course?.id||null });
      placedNote = `\n\n📌 Logged **${toolCall.input.topic}** as *${toolCall.input.rating}* — ${placed} adaptive review session${placed===1?'':'s'} added to your calendar.`;
      toast(`Adaptive reschedule: ${placed} review session(s) added for "${toolCall.input.topic}".`, 'success');
    }
    state.chat.push({ role:'assistant', content:(reply||'Got it.') + placedNote, ts:Date.now() });
  }catch(err){
    state.chat.pop();
    state.chat.push({ role:'assistant', content: apiErrorMessage(err), ts:Date.now() });
  }
  save(); render(); scrollChatToBottom();
}

function scrollChatToBottom(){
  ['chatMsgsInline','chatMsgsDrawer'].forEach(id=>{ const el=$('#'+id); if(el) el.scrollTop = el.scrollHeight; });
}

/* ---------------------------------- GLOBAL BINDING ---------------------------------- */

let boundOnce = false;
function bindGlobalOnce(force){
  if(boundOnce && !force) return;
  boundOnce = true;

  document.body.addEventListener('click', (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const fn = actions[el.dataset.action];
    if(fn) fn(el, e);
  });

  document.body.addEventListener('submit', (e)=>{
    if(e.target.id==='taskForm') handleTaskFormSubmit(e);
  });

  document.body.addEventListener('change', (e)=>{
    if(e.target.id==='importFileInput' && e.target.files[0]) importJSONFile(e.target.files[0]);
    if(e.target.id==='lectureFileInput') handleLectureFileChange(e);
    if(e.target.id==='cMaxHours'){ const badge = e.target.closest('div').querySelector('span'); if(badge) badge.textContent = e.target.value+'h'; }
  });

  document.body.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' && !e.shiftKey && (e.target.id==='chatInputInline' || e.target.id==='chatInputDrawer')){
      e.preventDefault();
      handleSendChat(e.target.id==='chatInputInline' ? 'inline' : 'drawer');
    }
    if(e.key==='Escape') closeAllModals();
  });

  document.body.addEventListener('click', (e)=>{
    if(e.target.id==='submitLecture' || e.target.closest('[data-action="submitLecture"]')) handleSubmitLecture();
    if(e.target.id==='submitRoadmap' || e.target.closest('[data-action="submitRoadmap"]')) handleSubmitRoadmap();
  });
}
